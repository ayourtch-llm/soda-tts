[package]
name = "soda-tts"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Enables an Apple Metal code path for the candle backend. Note: as
# measured on an M-series CPU, Metal is currently *slower* than CPU
# for this model (1.8x slower on a 5.6s utterance). The model has
# many small ops and small batches so per-op GPU dispatch overhead
# dominates. The feature exists for experimentation; CPU is the
# recommended candle device for now.
metal = ["candle-core/metal", "candle-nn/metal"]

[dependencies]
# ONNX Runtime via the official Rust wrapper. By default `ort` downloads
# pre-built libonnxruntime binaries on first build.
ort = "2.0.0-rc.7"
ndarray = "0.17"
candle-core = "0.10"
candle-nn = "0.10"
safetensors = "0.4"
rand = "0.8"
rand_distr = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
unicode-normalization = "0.1"
hf-hub = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }


[profile.release]
opt-level = 3
lto = "thin"
